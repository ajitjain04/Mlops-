name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/adaptivephish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull the V1 model artifact from the DVC remote (read-only AWS user)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          python -m pip install "dvc[s3]==3.67.1"
          dvc pull models/v1
          ls -l models/v1
      - name: Set image tag
        run: echo "TAG=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t "$IMAGE:$TAG" .
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 "$IMAGE:$TAG"
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep '"model_version":"v1"'
          curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"url":"https://www.nyc.gov/site/dcas/employment/jobs.page"}' | grep '"prediction"'
          curl -sf localhost:8000/metrics | grep adaptivephish_model_loaded
          docker logs smoke
          docker rm -f smoke
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image (immutable short-SHA tag)
        run: docker push "$IMAGE:$TAG"
