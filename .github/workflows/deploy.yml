name: Deploy to EC2

# Manual only. The job uses the "production" environment, so a required reviewer must approve
# before it can assume the AWS role. AWS access is OIDC (no stored AWS keys); the command is
# sent to the instance through SSM Run Command (no SSH, no inbound port 22).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Short-SHA image tag already published by "Build and push image", or "previous" to roll back'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/adaptivephish
      INPUT_TAG: ${{ inputs.image_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the tag input
        run: |
          [[ "$INPUT_TAG" =~ ^([0-9a-f]{7}|previous)$ ]] || { echo "tag must be 7 hex chars or 'previous'"; exit 1; }
      - name: Require a green build-and-push run for this tag
        if: inputs.image_tag != 'previous'
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-and-push.yml/runs?status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha | startswith(\"$INPUT_TAG\"))] | length")
          echo "successful build-and-push runs for $INPUT_TAG: $n"
          [ "$n" -ge 1 ]
      - name: Require the tag to exist on Docker Hub
        if: inputs.image_tag != 'previous'
        run: curl -sf "https://hub.docker.com/v2/repositories/$IMAGE_REPO/tags/$INPUT_TAG" | grep -q '"name"'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: gha-deploy-${{ github.run_id }}
      - name: Deploy through SSM and wait for the smoke test
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          { echo "#!/bin/bash"; echo "export IMAGE_REPO='$IMAGE_REPO' TAG='$INPUT_TAG'"; cat scripts/deploy/remote_deploy.sh; } > remote.sh
          jq -Rs '{commands: [.], executionTimeout: ["900"]}' remote.sh > params.json
          cmd=$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$INSTANCE_ID" \
            --comment "adaptivephish deploy $INPUT_TAG (run $GITHUB_RUN_ID)" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "command id: $cmd"
          sleep 5
          aws ssm wait command-executed --command-id "$cmd" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json > result.json
          jq -r '.Stdout, "--- stderr ---", .Stderr' result.json
          status=$(jq -r .Status result.json)
          echo "SSM status: $status"
          [ "$status" = "Success" ]
