stages:
  fetch_meta:
    cmd: python scripts/inspect_dataset.py --out data/interim/phreshphish_meta.parquet
    deps:
      - scripts/inspect_dataset.py
    outs:
      - data/interim/phreshphish_meta.parquet
  build_subset:
    cmd: python scripts/build_subset.py
    deps:
      - scripts/build_subset.py
      - data/interim/phreshphish_meta.parquet
    params:
      - subset
    outs:
      - data/processed/subset.parquet
    metrics:
      - reports/results/subset_manifest.json:
          cache: false
  featurize:
    cmd: python scripts/build_features.py
    deps:
      - scripts/build_features.py
      - src/adaptivephish/features/url_features.py
      - data/processed/subset.parquet
    outs:
      - data/processed/features.parquet
    metrics:
      - reports/results/feature_schema.json:
          cache: false
  train:
    cmd: python scripts/run_experiments.py
    deps:
      - scripts/run_experiments.py
      - src/adaptivephish/features/url_features.py
      - data/processed/features.parquet
      - reports/results/subset_manifest.json
    params:
      - train
    outs:
      - models/v1
      - models/production.json:
          cache: false
      - reports/results/feature_diagnostics.csv:
          cache: false
      - reports/results/v1_permutation_importance_val.csv:
          cache: false
      - reports/figures/f1_random_vs_temporal.png:
          cache: false
    metrics:
      - reports/results/experiments_summary.json:
          cache: false
